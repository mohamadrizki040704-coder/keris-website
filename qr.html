<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code – Pusaka Nusantara</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{margin:0;background:#1a1a1a;color:#f5f0e6;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:1rem;text-align:center}
  .kartu{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:1.5rem;width:min(92vw,380px)}
  h1{font-family:Georgia,serif;font-size:1.6rem;margin:0 0 .3rem;color:#c9a227}
  p{color:#b8b0a0;margin:.3rem 0 1rem}
  #qr{background:#fff;padding:16px;display:inline-block;border-radius:6px;min-height:288px;min-width:288px}
  input{width:100%;padding:.7rem;margin:1rem 0 .6rem;border-radius:4px;border:1px solid #3a3a3a;background:#1a1a1a;color:#f5f0e6;font:inherit}
  button{width:100%;padding:.8rem;margin-top:.5rem;border:0;border-radius:4px;font:inherit;font-weight:600;cursor:pointer;background:#c9a227;color:#1a1a1a}
  button.alt{background:none;border:1px solid #c9a227;color:#f5f0e6}
  .peringatan{color:#e0a060;font-size:.9rem}
  @media print{body{background:#fff;color:#000}.kartu{border:0;background:#fff}h1,p{color:#000}input,button,.peringatan{display:none}}
</style>
</head>
<body>
<div class="kartu">
  <h1>Pusaka Nusantara</h1>
  <p>Scan untuk melihat koleksi keris</p>
  <div id="qr"></div>
  <input id="url" type="url" aria-label="Alamat website" placeholder="https://namasitus.netlify.app">
  <p class="peringatan" id="info"></p>
  <button id="unduh">Unduh gambar QR (PNG)</button>
  <button id="cetak" class="alt">Cetak</button>
</div>
<script>
const $url = document.getElementById("url"), $qr = document.getElementById("qr"), $info = document.getElementById("info");

// Alamat awal = alamat halaman ini, tanpa "qr.html"
$url.value = location.protocol.startsWith("http") ? location.href.replace(/qr\.html.*$/, "") : "";

function buat() {
  $qr.innerHTML = "";
  const url = $url.value.trim();
  if (!url) { $info.textContent = "Isi alamat website kamu di kolom di atas."; return; }
  $info.textContent = /^https?:\/\/(localhost|127\.|192\.168\.)/.test(url)
    ? "Alamat ini hanya bisa dibuka di jaringan kamu sendiri. Pakai alamat Netlify agar semua orang bisa scan." : "";
  new QRCode($qr, { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
}
$url.addEventListener("input", buat);

document.getElementById("unduh").addEventListener("click", () => {
  const src = $qr.querySelector("canvas");
  if (!src) return;
  const c = document.createElement("canvas"), pad = 32;
  c.width = c.height = src.width + pad * 2;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, pad, pad);
  const a = document.createElement("a");
  a.download = "qr-pusaka-nusantara.png"; a.href = c.toDataURL("image/png"); a.click();
});
document.getElementById("cetak").addEventListener("click", () => print());
buat();
</script>
</body>
</html>
